name: faq
description: Fluxo de perguntas frequentes
start_state: faq_intro
states:
  faq_intro:
    intent_triggers:
      - faq
      - perguntas_frequentes
    message: "Aqui estao algumas duvidas comuns. Escolha uma opcao:"
    options:
      - label: "Prazos de entrega"
        value: "faq_shipping"
      - label: "Formas de pagamento"
        value: "faq_payment"
    transitions:
      - condition: "contains:entrega"
        target_state: faq_shipping
      - condition: "contains:pagamento"
        target_state: faq_payment
  faq_shipping:
    intent_triggers:
      - entrega
      - prazo_entrega
    message: "Nossos prazos de entrega variam de 3 a 5 dias uteis."
  faq_payment:
    intent_triggers:
      - pagamento
      - formas_pagamento
    message: "Aceitamos cartoes, PIX e boleto bancario."
