name: faq
description: Fluxo de perguntas frequentes
start_state: faq_intro
states:
  faq_intro:
    message: "Aqui estão algumas dúvidas comuns. Escolha uma opção:"
    options:
      - label: "Prazos de entrega"
        value: "faq_shipping"
      - label: "Formas de pagamento"
        value: "faq_payment"
    transitions:
      - condition: "contains:entrega"
        target_state: faq_shipping
      - condition: "contains:pagamento"
        target_state: faq_payment
  faq_shipping:
    message: "Nossos prazos de entrega variam de 3 a 5 dias úteis."
  faq_payment:
    message: "Aceitamos cartões, PIX e boleto bancário."
