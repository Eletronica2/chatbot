<!DOCTYPE html>

<html class="dark" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Atenda Ai - Gerar Proposta Comercial</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-error": "#690005",
                    "on-background": "#dde3e7",
                    "on-surface-variant": "#bbc9cf",
                    "surface-container": "#1a2123",
                    "secondary-fixed": "#e9ddff",
                    "error-container": "#93000a",
                    "surface-container-lowest": "#090f12",
                    "surface-container-low": "#161d1f",
                    "surface-container-high": "#242b2e",
                    "outline-variant": "#3c494e",
                    "on-primary-fixed": "#001f28",
                    "surface-dim": "#0e1417",
                    "inverse-surface": "#dde3e7",
                    "error": "#ffb4ab",
                    "secondary-fixed-dim": "#d0bcff",
                    "outline": "#859399",
                    "surface": "#0e1417",
                    "secondary-container": "#571bc1",
                    "tertiary-fixed-dim": "#ffba49",
                    "tertiary-container": "#feb127",
                    "background": "#0e1417",
                    "surface-container-highest": "#2f3639",
                    "inverse-primary": "#00677f",
                    "on-secondary-fixed-variant": "#5516be",
                    "surface-bright": "#333a3d",
                    "on-tertiary-fixed-variant": "#624000",
                    "on-tertiary-container": "#6b4700",
                    "on-secondary-fixed": "#23005c",
                    "inverse-on-surface": "#2b3134",
                    "on-tertiary-fixed": "#291800",
                    "primary": "#a4e6ff",
                    "on-tertiary": "#442b00",
                    "on-error-container": "#ffdad6",
                    "on-surface": "#dde3e7",
                    "primary-fixed": "#b7eaff",
                    "tertiary-fixed": "#ffddb1",
                    "tertiary": "#ffd59c",
                    "on-primary-fixed-variant": "#004e60",
                    "on-primary-container": "#00566a",
                    "on-secondary-container": "#c4abff",
                    "on-primary": "#003543",
                    "primary-container": "#00d1ff",
                    "primary-fixed-dim": "#4cd6ff",
                    "secondary": "#d0bcff",
                    "on-secondary": "#3c0091",
                    "surface-tint": "#4cd6ff",
                    "surface-variant": "#2f3639"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "stack-md": "1rem",
                    "gutter": "1.5rem",
                    "stack-lg": "2rem",
                    "grid-opacity": "0.05",
                    "margin-page": "2rem",
                    "stack-sm": "0.5rem"
            },
            "fontFamily": {
                    "body-md": ["Manrope"],
                    "label-md": ["Manrope"],
                    "body-lg": ["Manrope"],
                    "headline-lg": ["Manrope"],
                    "headline-md": ["Manrope"],
                    "headline-sm": ["Manrope"],
                    "headline-lg-mobile": ["Manrope"]
            },
            "fontSize": {
                    "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "headline-sm": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "headline-lg-mobile": ["26px", {"lineHeight": "32px", "fontWeight": "700"}]
            }
          }
        }
      }
    </script>
<style>
        /* Cyber-Minimalism Elements */
        body {
            background-color: #07080d;
            background-image: radial-gradient(rgba(164, 230, 255, 0.03) 1px, transparent 1px);
            background-size: 20px 20px;
            color: #dde3e7;
            font-family: 'Manrope', sans-serif;
            overflow: hidden; /* Lock background scrolling for modal view */
        }
        
        .glass-panel {
            background: rgba(17, 20, 29, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 24px 64px -12px rgba(0, 0, 0, 0.8);
        }
        
        .input-glow:focus {
            border-color: #00d1ff;
            box-shadow: 0 0 0 4px rgba(0, 209, 255, 0.2);
            outline: none;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #2f3639;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3c494e;
        }
    </style>
</head>
<body class="antialiased min-h-screen flex items-center justify-center p-4">
<!-- Modal Overlay -->
<div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-40 transition-opacity"></div>
<!-- Modal Container -->
<div class="glass-panel w-full max-w-3xl rounded-xl z-50 flex flex-col max-h-[90vh] shadow-[inset_0_1px_0_rgba(164,230,255,0.1)] relative">
<!-- Header -->
<div class="px-gutter py-stack-md border-b border-outline-variant flex items-center justify-between shrink-0">
<div>
<h2 class="font-headline-md text-headline-md text-on-surface flex items-center gap-2">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">description</span>
                    Gerar Proposta Comercial
                </h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-1">Configure os detalhes da proposta para o Lead selecionado.</p>
</div>
<button class="text-on-surface-variant hover:text-on-surface transition-colors p-2 rounded-full hover:bg-surface-container-highest">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Scrollable Content -->
<div class="p-gutter overflow-y-auto flex-1 custom-scrollbar space-y-stack-lg">
<!-- Grid Layout for Fields -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-stack-md">
<!-- Plano Dropdown -->
<div class="col-span-1 md:col-span-2 space-y-2">
<label class="block font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Plano Selecionado</label>
<div class="relative">
<select class="w-full bg-[#07080d] border border-outline-variant rounded-lg px-4 py-3 font-body-md text-body-md text-on-surface appearance-none input-glow transition-all">
<option disabled="" selected="" value="">Selecione um plano...</option>
<option value="starter">Starter</option>
<option value="growth_basic">Growth Basic</option>
<option value="growth">Growth</option>
<option value="pro">Pro</option>
<option value="enterprise">Enterprise</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
</div>
<!-- Valor Mensalidade -->
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Valor Mensalidade (R$)</label>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant font-body-md">R$</span>
<input class="w-full bg-[#07080d] border border-outline-variant rounded-lg pl-10 pr-4 py-3 font-body-md text-body-md text-on-surface input-glow transition-all" placeholder="0,00" type="text"/>
</div>
</div>
<!-- Taxa de Implantação -->
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Taxa de Implantação (R$)</label>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant font-body-md">R$</span>
<input class="w-full bg-[#07080d] border border-outline-variant rounded-lg pl-10 pr-4 py-3 font-body-md text-body-md text-on-surface input-glow transition-all" placeholder="0,00" type="text"/>
</div>
</div>
<!-- Limite de Mensagens -->
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Limite de Mensagens/Mês</label>
<input class="w-full bg-[#07080d] border border-outline-variant rounded-lg px-4 py-3 font-body-md text-body-md text-on-surface input-glow transition-all" placeholder="Ex: 50000" type="number"/>
</div>
<!-- Validade da Proposta -->
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Validade (Dias)</label>
<div class="relative">
<input class="w-full bg-[#07080d] border border-outline-variant rounded-lg px-4 py-3 font-body-md text-body-md text-on-surface input-glow transition-all" type="number" value="15"/>
<span class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant font-body-md pointer-events-none">dias</span>
</div>
</div>
</div>
<!-- Itens Inclusos (Tags Input Simulation) -->
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface-variant uppercase tracking-wider flex items-center gap-2">
                    Itens Inclusos
                    <span class="material-symbols-outlined text-[16px] text-secondary-container" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
</label>
<div class="bg-[#07080d] border border-outline-variant rounded-lg p-3 min-h-[100px] flex flex-wrap gap-2 focus-within:border-primary focus-within:ring-4 focus-within:ring-primary/20 transition-all">
<!-- Chips -->
<span class="inline-flex items-center gap-1 px-3 py-1 bg-surface-container-high rounded-full border border-outline-variant font-body-md text-[13px] text-on-surface">
                        Atendimento IA
                        <button class="hover:text-error transition-colors"><span class="material-symbols-outlined text-[14px]">close</span></button>
</span>
<span class="inline-flex items-center gap-1 px-3 py-1 bg-surface-container-high rounded-full border border-outline-variant font-body-md text-[13px] text-on-surface">
                        Integração CRM
                        <button class="hover:text-error transition-colors"><span class="material-symbols-outlined text-[14px]">close</span></button>
</span>
<span class="inline-flex items-center gap-1 px-3 py-1 bg-secondary-container/20 border border-secondary-container rounded-full font-body-md text-[13px] text-secondary">
<span class="material-symbols-outlined text-[12px]">bolt</span>
                        Automação Avançada
                        <button class="hover:text-error transition-colors"><span class="material-symbols-outlined text-[14px]">close</span></button>
</span>
<input class="bg-transparent border-none outline-none font-body-md text-body-md text-on-surface flex-1 min-w-[200px] placeholder-on-surface-variant/50" placeholder="Adicionar item e pressionar Enter..." type="text"/>
</div>
</div>
<!-- Observações -->
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Observações (Internas/Extras)</label>
<textarea class="w-full bg-[#07080d] border border-outline-variant rounded-lg px-4 py-3 font-body-md text-body-md text-on-surface input-glow transition-all resize-none" placeholder="Insira detalhes adicionais, condições especiais de pagamento ou notas internas..." rows="3"></textarea>
</div>
</div>
<!-- Footer Actions -->
<div class="px-gutter py-stack-md border-t border-outline-variant bg-surface-container/50 flex items-center justify-end gap-3 shrink-0 rounded-b-xl">
<button class="px-6 py-2.5 rounded-lg font-label-md text-label-md text-on-surface hover:bg-surface-container-highest transition-colors uppercase tracking-wider">
                Cancelar
            </button>
<button class="px-6 py-2.5 rounded-lg font-label-md text-label-md text-secondary border border-secondary-container hover:bg-secondary-container/10 transition-colors uppercase tracking-wider flex items-center gap-2 shadow-[inset_0_0_8px_rgba(87,27,193,0.2)]">
<span class="material-symbols-outlined text-[18px]">send</span>
                Salvar como enviada
            </button>
<button class="px-6 py-2.5 rounded-lg bg-primary text-on-primary font-label-md text-label-md hover:bg-primary-fixed-dim transition-colors uppercase tracking-wider shadow-[0_0_15px_rgba(0,209,255,0.3)] flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1;">picture_as_pdf</span>
                Gerar PDF
            </button>
</div>
</div>
</body></html>
