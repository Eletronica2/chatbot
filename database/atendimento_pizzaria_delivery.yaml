name: atendimento_pizzaria_delivery
description: "Atendimento humanizado e conversacional para a Pizzaria Bella Massa — delivery e retirada"
start_state: boas_vindas
fallback_ai: true

business_hours:
  timezone: America/Sao_Paulo
  schedule:
    monday:    { open: "18:00", close: "23:00" }
    tuesday:   { open: "18:00", close: "23:00" }
    wednesday: { open: "18:00", close: "23:00" }
    thursday:  { open: "18:00", close: "23:00" }
    friday:    { open: "18:00", close: "00:00" }
    saturday:  { open: "18:00", close: "00:00" }
    sunday:    { open: "18:00", close: "22:00" }

# ─────────────────────────────────────────────────────────────
# ALIASES: frases naturais que o cliente pode dizer →
#          mapeadas para um intent canônico.
#          Usadas por _find_state_by_intent + intent_triggers.
# ─────────────────────────────────────────────────────────────
intent_aliases:
  horario:
    - horario
    - funciona
    - abre
    - funcionamento
    - que horas abre
    - ate que horas
    - aberto agora
    - voces abrem
    - abre hoje
    - fecha que horas
    - ta aberto
    - quando abre
  promocao:
    - promocao
    - desconto
    - cupom
    - oferta
    - tem promocao
    - alguma promocao
    - combo
    - tem desconto
  bebidas:
    - bebidas
    - refrigerante
    - suco
    - agua
    - o que tem pra beber
    - beber
    - refri
    - coca
    - guarana
    - fanta
    - sprite
  atendente:
    - atendente
    - humano
    - pessoa
    - falar com alguem
    - preciso de ajuda
    - falar com atendente
    - quero falar
  consultar:
    - consultar pedido
    - meu pedido
    - onde esta meu pedido
    - status
    - rastrear pedido
    - status do pedido
    - cade meu pedido
    - quanto tempo falta

# ─────────────────────────────────────────────────────────────
# TRANSIÇÕES GLOBAIS: verificadas em QUALQUER estado quando
#                     nenhuma transição local corresponde.
#                     Ativam smart_reentry automaticamente.
# ─────────────────────────────────────────────────────────────
global_transitions:
  - condition:
      contains: "atendente"
    target_state: atendente_humano
  - condition:
      contains: "humano"
    target_state: atendente_humano
  - condition:
      contains: "falar com"
    target_state: atendente_humano
  - condition:
      contains: "cardapio"
    target_state: cardapio_principal
  - condition:
      contains: "menu"
    target_state: cardapio_principal
  - condition:
      contains: "horario"
    target_state: horario_funcionamento
  - condition:
      contains: "funciona"
    target_state: horario_funcionamento
  - condition:
      contains: "abre"
    target_state: horario_funcionamento
  - condition:
      contains: "promocao"
    target_state: promocoes_do_dia
  - condition:
      contains: "desconto"
    target_state: promocoes_do_dia
  - condition:
      contains: "combo"
    target_state: promocoes_do_dia
  - condition:
      contains: "refrigerante"
    target_state: bebidas
  - condition:
      contains: "bebida"
    target_state: bebidas
  - condition:
      contains: "beber"
    target_state: bebidas
  - condition:
      contains: "coca"
    target_state: bebidas
  - condition:
      contains: "guarana"
    target_state: bebidas
  - condition:
      contains: "status"
    target_state: consultar_pedido
  - condition:
      contains: "meu pedido"
    target_state: consultar_pedido
  - condition:
      contains: "cancelar"
    target_state: boas_vindas
  - condition:
      contains: "voltar"
    target_state: boas_vindas

# ─────────────────────────────────────────────────────────────
# ESTADOS
# ─────────────────────────────────────────────────────────────
states:
  # ── Boas-vindas ──────────────────────────────────────────────
  boas_vindas:
    message: |
      Oi! Bem-vindo à Pizzaria Bella Massa! 🍕😊

      Sou o assistente virtual da pizzaria e fico feliz em te atender!

      Me fala o que você precisa — posso mostrar nosso cardápio, te contar sobre as promoções de hoje, ajudar com um pedido ou informar nossos horários 😄
    fallback_ai: true
    options:
      - label: "Ver cardápio 🍕"
        value: "cardapio"
      - label: "Fazer pedido 🛵"
        value: "pedido"
      - label: "Promoções do dia 🔥"
        value: "promocao"
      - label: "Horários ⏰"
        value: "horario"
    transitions:
      - condition: "contains:cardapio"
        target_state: cardapio_principal
      - condition: "contains:menu"
        target_state: cardapio_principal
      - condition: "contains:pizza"
        target_state: cardapio_principal
      - condition: "contains:pedido"
        target_state: iniciar_pedido
      - condition: "contains:quero"
        target_state: iniciar_pedido
      - condition: "contains:pedir"
        target_state: iniciar_pedido
      - condition: "contains:promocao"
        target_state: promocoes_do_dia
      - condition: "contains:desconto"
        target_state: promocoes_do_dia
      - condition: "contains:horario"
        target_state: horario_funcionamento
      - condition: "contains:abre"
        target_state: horario_funcionamento
      - condition: "contains:funciona"
        target_state: horario_funcionamento
      - condition: "contains:bebida"
        target_state: bebidas
      - condition: "contains:refrigerante"
        target_state: bebidas
      - condition: "contains:consultar"
        target_state: consultar_pedido
      - condition: "contains:status"
        target_state: consultar_pedido
      - condition: "contains:atendente"
        target_state: atendente_humano
      - condition: "contains:humano"
        target_state: atendente_humano

  # ── Cardápio principal ──────────────────────────────────────────
  cardapio_principal:
    message: |
      Aqui está nosso cardápio! 😍🍕

      🍕 *Tradicionais* — a partir de R$ 39,90
      Mussarela, Calabresa, Portuguesa, Frango c/ Catupiry...

      ⭐ *Especiais* — a partir de R$ 59,90
      Camaão, Parma c/ Rúcula, Quatro Queijos, Costela BBQ...

      🍫 *Doces* — a partir de R$ 42,90
      Chocolate c/ Morango, Banana c/ Canela, Nutella...

      🥤 *Bebidas* — a partir de R$ 4,00
      Refrigerantes, Sucos, Água...

      Quer ver os sabores de uma categoria específica ou já quer fazer seu pedido? 😊
    fallback_ai: true
    options:
      - label: "Tradicionais 🍕"
        value: "tradicionais"
      - label: "Especiais ⭐"
        value: "especiais"
      - label: "Doces 🍫"
        value: "doces"
      - label: "Bebidas 🥤"
        value: "bebidas"
      - label: "Fazer pedido 🛵"
        value: "pedido"
    transitions:
      - condition: "contains:tradicional"
        target_state: pizzas_tradicionais
      - condition: "contains:especial"
        target_state: pizzas_especiais
      - condition: "contains:doce"
        target_state: pizzas_doces
      - condition: "contains:chocolate"
        target_state: pizzas_doces
      - condition: "contains:nutella"
        target_state: pizzas_doces
      - condition: "contains:bebida"
        target_state: bebidas
      - condition: "contains:refrigerante"
        target_state: bebidas
      - condition: "contains:pedido"
        target_state: iniciar_pedido
      - condition: "contains:quero"
        target_state: iniciar_pedido
      - condition: "contains:pedir"
        target_state: iniciar_pedido

  # ── Pizzas tradicionais ────────────────────────────────────────
  pizzas_tradicionais:
    message: |
      Nossas Pizzas Tradicionais 🍕

      • *Mussarela* — R$ 39,90 / R$ 49,90 / R$ 59,90
      • *Calabresa* — R$ 42,90 / R$ 52,90 / R$ 62,90
      • *Portuguesa* — R$ 45,90 / R$ 55,90 / R$ 65,90
      • *Frango c/ Catupiry* — R$ 46,90 / R$ 56,90 / R$ 66,90
      • *Palmito* — R$ 43,90 / R$ 53,90 / R$ 63,90
      • *Napolitana* — R$ 40,90 / R$ 50,90 / R$ 60,90

      _(Preços: Broto 25cm / Média 35cm / Grande 45cm)_

      Quer pedir alguma dessas? Posso te ajudar! 😄
    fallback_ai: true
    options:
      - label: "Fazer pedido 🛵"
        value: "pedido"
      - label: "Ver especiais ⭐"
        value: "especiais"
      - label: "Ver doces 🍫"
        value: "doces"
    transitions:
      - condition: "contains:pedido"
        target_state: iniciar_pedido
      - condition: "contains:quero"
        target_state: iniciar_pedido
      - condition: "contains:pedir"
        target_state: iniciar_pedido
      - condition: "contains:especial"
        target_state: pizzas_especiais
      - condition: "contains:doce"
        target_state: pizzas_doces

  # ── Pizzas especiais ─────────────────────────────────────────
  pizzas_especiais:
    message: |
      Nossas Pizzas Especiais ⭐🍕

      • *Camaão Especial* — R$ 69,90 / R$ 82,90 / R$ 99,90
      • *Parma com Rúcula* — R$ 64,90 / R$ 77,90 / R$ 92,90
      • *Quatro Queijos Premium* — R$ 59,90 / R$ 72,90 / R$ 87,90
      • *Costela BBQ* — R$ 72,90 / R$ 85,90 / R$ 102,90
      • *Salmão Defumado* — R$ 74,90 / R$ 89,90 / R$ 109,90

      _(Preços: Broto 25cm / Média 35cm / Grande 45cm)_

      São incríveis! Quer montar seu pedido? 😍
    fallback_ai: true
    options:
      - label: "Fazer pedido 🛵"
        value: "pedido"
      - label: "Ver tradicionais 🍕"
        value: "tradicionais"
      - label: "Ver doces 🍫"
        value: "doces"
    transitions:
      - condition: "contains:pedido"
        target_state: iniciar_pedido
      - condition: "contains:quero"
        target_state: iniciar_pedido
      - condition: "contains:pedir"
        target_state: iniciar_pedido
      - condition: "contains:tradicional"
        target_state: pizzas_tradicionais
      - condition: "contains:doce"
        target_state: pizzas_doces

  # ── Pizzas doces ──────────────────────────────────────────────
  pizzas_doces:
    message: |
      Pizzas Doces — pra adoçar a noite! 🍫😊

      • *Chocolate c/ Morango* — R$ 49,90 / R$ 59,90 / R$ 72,90
      • *Banana c/ Canela* — R$ 42,90 / R$ 52,90 / R$ 63,90
      • *Prestígio* — R$ 47,90 / R$ 57,90 / R$ 69,90
      • *Nutella c/ Leite Ninho* — R$ 59,90 / R$ 72,90 / R$ 86,90
      • *Romeu e Julieta* — R$ 44,90 / R$ 54,90 / R$ 66,90

      _(Preços: Broto 25cm / Média 35cm / Grande 45cm)_

      Bateu a vontade? Posso montar seu pedido! 🍕
    fallback_ai: true
    options:
      - label: "Fazer pedido 🛵"
        value: "pedido"
      - label: "Ver tradicionais 🍕"
        value: "tradicionais"
      - label: "Ver especiais ⭐"
        value: "especiais"
    transitions:
      - condition: "contains:pedido"
        target_state: iniciar_pedido
      - condition: "contains:quero"
        target_state: iniciar_pedido
      - condition: "contains:pedir"
        target_state: iniciar_pedido
      - condition: "contains:tradicional"
        target_state: pizzas_tradicionais
      - condition: "contains:especial"
        target_state: pizzas_especiais

  # ── Bebidas ─────────────────────────────────────────────────────
  bebidas:
    message: |
      Nossas bebidas 🥤

      • *Refrigerante Lata* (350ml) — R$ 7,00
        Coca-Cola, Guaraná Antarctica, Fanta, Sprite
      • *Refrigerante 2L* — R$ 14,00
        Coca-Cola, Guaraná Antarctica, Fanta
      • *Suco Natural* (500ml) — R$ 10,00
        Laranja, Limão, Maracujá, Uva
      • *Água Mineral* (500ml) — R$ 4,00
      • *Água com Gás* (500ml) — R$ 5,00

      Posso adicionar ao seu pedido! Quer pedir? 😊
    intent_triggers:
      - bebidas
    fallback_ai: true
    options:
      - label: "Fazer pedido 🛵"
        value: "pedido"
      - label: "Ver cardápio 🍕"
        value: "cardapio"
    transitions:
      - condition: "contains:pedido"
        target_state: iniciar_pedido
      - condition: "contains:quero"
        target_state: iniciar_pedido
      - condition: "contains:pedir"
        target_state: iniciar_pedido
      - condition: "contains:cardapio"
        target_state: cardapio_principal
      - condition: "contains:menu"
        target_state: cardapio_principal

  # ── Promoções ─────────────────────────────────────────────────
  promocoes_do_dia:
    message: |
      🔥 Promoções de Hoje!

      🍕 *Combo Família*
      2 Pizzas Grandes Tradicionais + Refrigerante 2L
      De R$ 139,70 por apenas *R$ 89,90*

      🍫 *Pizza Doce com 20% OFF*
      Válido após as 22h — qualquer sabor doce!

      🛵 *Frete Grátis*
      Para pedidos acima de R$ 80,00 em até 5km

      ⭐ *Especial do Dia*
      Pizza Grande Quatro Queijos Premium por *R$ 69,90*
      _(normalmente R$ 87,90)_

      Aproveita! Qual promoção te interessa? 😄
    intent_triggers:
      - promocao
    fallback_ai: true
    options:
      - label: "Quero o Combo Família 🍕"
        value: "pedido"
      - label: "Ver cardápio completo"
        value: "cardapio"
    transitions:
      - condition: "contains:pedido"
        target_state: iniciar_pedido
      - condition: "contains:quero"
        target_state: iniciar_pedido
      - condition: "contains:combo"
        target_state: iniciar_pedido
      - condition: "contains:cardapio"
        target_state: cardapio_principal

  # ── Horário ─────────────────────────────────────────────────────
  horario_funcionamento:
    message: |
      Nossos horários de funcionamento ⏰

      🗓 *Segunda a Quinta:* 18h às 23h
      🗓 *Sexta e Sábado:* 18h à 00h
      🗓 *Domingo:* 18h às 22h

      🛵 *Delivery disponível* todos os dias!
      📍 *Retirada no local* — sem taxa de entrega

      {cta_pedido}
    intent_triggers:
      - horario
    fallback_ai: true
    options:
      - label: "Fazer pedido 🛵"
        value: "pedido"
      - label: "Ver cardápio 🍕"
        value: "cardapio"
    transitions:
      - condition: "contains:pedido"
        target_state: iniciar_pedido
      - condition: "contains:quero"
        target_state: iniciar_pedido
      - condition: "contains:cardapio"
        target_state: cardapio_principal
      - condition: "contains:menu"
        target_state: cardapio_principal

  # ── FLUXO DE PEDIDO ─────────────────────────────────────────────
  iniciar_pedido:
    message: |
      Ótimo, vamos lá! 😄🍕

      Pra começar: qual é o seu nome?
    collect: customer_name
    options:
      - label: "Preciso de ajuda"
        value: "atendente"
    transitions:
      - condition: "contains:atendente"
        target_state: atendente_humano
      - condition: "contains:humano"
        target_state: atendente_humano
      - condition: "contains:cardapio"
        target_state: cardapio_principal
      - condition: "*"
        target_state: pedido_tamanho

  pedido_tamanho:
    message: |
      Que prazer! 😊

      Qual tamanho de pizza você prefere?

      🍕 *Broto* (25cm) — pra 1-2 pessoas
      🍕 *Média* (35cm) — pra 2-3 pessoas
      🍕 *Grande* (45cm) — pra 3-4 pessoas

      Pode pedir mais de uma também, sem problema 😄
    collect: pizza_size
    options:
      - label: "Broto"
        value: "broto"
      - label: "Média"
        value: "media"
      - label: "Grande"
        value: "grande"
    transitions:
      - condition: "contains:atendente"
        target_state: atendente_humano
      - condition: "contains:humano"
        target_state: atendente_humano
      - condition: "contains:cardapio"
        target_state: cardapio_principal
      - condition: "*"
        target_state: pedido_sabores

  pedido_sabores:
    message: |
      Boa escolha! 🍕✨

      Agora me conta: quais sabores você gostaria?

      Pode combinar até dois sabores numa pizza sem custo adicional 😄
      Se quiser ver o cardápio pra lembrar os sabores, é só falar!
    collect: pizza_flavors
    fallback_ai: true
    options:
      - label: "Ver cardápio 🍕"
        value: "cardapio"
      - label: "Tradicionais"
        value: "tradicionais"
      - label: "Especiais ⭐"
        value: "especiais"
      - label: "Doces 🍫"
        value: "doces"
    transitions:
      - condition: "contains:cardapio"
        target_state: cardapio_principal
      - condition: "contains:menu"
        target_state: cardapio_principal
      - condition: "contains:tradicional"
        target_state: pizzas_tradicionais
      - condition: "contains:especial"
        target_state: pizzas_especiais
      - condition: "contains:doce"
        target_state: pizzas_doces
      - condition: "contains:atendente"
        target_state: atendente_humano
      - condition: "contains:humano"
        target_state: atendente_humano
      - condition: "*"
        target_state: pedido_bebida

  pedido_bebida:
    message: |
      Perfeito! 😍

      E pra beber? Temos:
      • Coca-Cola, Guaraná, Fanta, Sprite (lata ou 2L)
      • Sucos naturais (laranja, limão, maracujá, uva)
      • Água mineral

      Quer adicionar uma bebida ou prefere só a pizza mesmo? 😊
    collect: drink
    options:
      - label: "Coca-Cola lata"
        value: "coca-cola"
      - label: "Guaraná 2L"
        value: "guarana"
      - label: "Suco natural"
        value: "suco"
      - label: "Água mineral"
        value: "agua"
      - label: "Sem bebida"
        value: "sem bebida"
    transitions:
      - condition: "contains:atendente"
        target_state: atendente_humano
      - condition: "contains:cardapio"
        target_state: cardapio_principal
      - condition: "*"
        target_state: pedido_tipo_entrega

  pedido_tipo_entrega:
    message: |
      Ótimo! 🛵

      Você prefere receber em casa (entrega) ou vai buscar aqui na loja (retirada)?

      _(Delivery disponível para endereços em até 8km da pizzaria)_
    collect: delivery_type
    options:
      - label: "Entrega em casa 🛵"
        value: "entrega"
      - label: "Vou retirar 🏃"
        value: "retirada"
    transitions:
      - condition: "contains:entrega"
        target_state: pedido_endereco
      - condition: "contains:delivery"
        target_state: pedido_endereco
      - condition: "contains:casa"
        target_state: pedido_endereco
      - condition: "contains:retirada"
        target_state: pedido_pagamento
      - condition: "contains:buscar"
        target_state: pedido_pagamento
      - condition: "contains:retiro"
        target_state: pedido_pagamento
      - condition: "contains:busco"
        target_state: pedido_pagamento
      - condition: "contains:atendente"
        target_state: atendente_humano
      - condition: "*"
        target_state: pedido_endereco

  pedido_endereco:
    message: |
      Perfeito! 📍

      Qual é o endereço completo para entrega?

      _(Rua, número, bairro e complemento, se tiver)_
    collect: address
    fallback_ai: true
    options:
      - label: "Vou retirar no local"
        value: "retirada"
      - label: "Preciso de ajuda"
        value: "atendente"
    transitions:
      - condition: "contains:retirada"
        target_state: pedido_pagamento
      - condition: "contains:buscar"
        target_state: pedido_pagamento
      - condition: "contains:retiro"
        target_state: pedido_pagamento
      - condition: "contains:atendente"
        target_state: atendente_humano
      - condition: "contains:humano"
        target_state: atendente_humano
      - condition: "*"
        target_state: pedido_pagamento

  pedido_pagamento:
    message: |
      Quase lá! 💳

      Como você vai pagar?

      • *PIX* — chave: pizzariabellamassa@pix.com
      • *Cartão* — crédito ou débito (maquininha na entrega)
      • *Dinheiro* — informe se precisar de troco 😊
    collect: payment_method
    options:
      - label: "PIX 💸"
        value: "pix"
      - label: "Cartão de crédito"
        value: "credito"
      - label: "Cartão de débito"
        value: "debito"
      - label: "Dinheiro"
        value: "dinheiro"
    transitions:
      - condition: "contains:pix"
        target_state: pedido_confirmacao
      - condition: "contains:cartao"
        target_state: pedido_confirmacao
      - condition: "contains:credito"
        target_state: pedido_confirmacao
      - condition: "contains:debito"
        target_state: pedido_confirmacao
      - condition: "contains:dinheiro"
        target_state: pedido_confirmacao
      - condition: "contains:atendente"
        target_state: atendente_humano
      - condition: "*"
        target_state: pedido_confirmacao

  pedido_confirmacao:
    message: |
      🎉 Pedido recebido com sucesso!

      Nossa equipe já vai conferir tudo e em instantes você recebe a confirmação com o tempo estimado de entrega.

      Obrigado por pedir na Bella Massa! 🍕😊
      Em caso de dúvidas, pode chamar aqui mesmo!
    requires_handoff: true
    options:
      - label: "Falar com atendente"
        value: "atendente"
    transitions:
      - condition: "contains:atendente"
        target_state: atendente_humano
      - condition: "contains:humano"
        target_state: atendente_humano
    hook:
      action: "confirmar_pedido"

  # ── CONSULTAR PEDIDO ────────────────────────────────────────────
  consultar_pedido:
    message: |
      Claro! Vou verificar seu pedido 🔍

      Me passa o número do pedido ou o CPF utilizado na compra?
    intent_triggers:
      - consultar
    fallback_ai: true
    options:
      - label: "Falar com atendente"
        value: "atendente"
    transitions:
      - condition: "contains:atendente"
        target_state: atendente_humano
      - condition: "contains:humano"
        target_state: atendente_humano
      - condition: "*"
        target_state: consultar_pedido_resultado
    hook:
      action: "consultar_status_pedido"

  consultar_pedido_resultado:
    message: |
      Estou verificando o status do seu pedido agora... 📦

      Em instantes nossa equipe te responde com as informações atualizadas!
    options:
      - label: "Fazer novo pedido 🍕"
        value: "pedido"
      - label: "Falar com atendente"
        value: "atendente"
    transitions:
      - condition: "contains:pedido"
        target_state: iniciar_pedido
      - condition: "contains:atendente"
        target_state: atendente_humano
    hook:
      action: "verificar_status_pedido"

  # ── ATENDENTE HUMANO ────────────────────────────────────────────
  atendente_humano:
    message: |
      Claro! Já estou te conectando com um dos nossos atendentes 😊

      O tempo médio de espera é de até 5 minutos.

      Obrigado pela paciência! Estamos aqui pra te ajudar 🍕
    intent_triggers:
      - atendente
    requires_handoff: true
