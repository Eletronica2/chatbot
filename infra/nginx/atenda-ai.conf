# Production vhosts. Replace APP_DOMAIN and API_DOMAIN before enabling TLS.
# Expected:
#   app.APP_DOMAIN  → Flutter Web
#   api.APP_DOMAIN  → FastAPI + Meta data-deletion + Stripe
#   api.APP_DOMAIN/webhook → WhatsApp Gateway

upstream backend_api {
    server backend-api:8000;
}

upstream whatsapp_gateway {
    server whatsapp-gateway:40000;
}

server {
    listen 80;
    server_name app.APP_DOMAIN;
    client_max_body_size 20m;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name api.APP_DOMAIN;
    client_max_body_size 20m;

    location /health {
        proxy_pass http://backend_api/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /webhook {
        proxy_pass http://whatsapp_gateway/webhook;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# HTTPS server blocks are added by Certbot (see docs/DEPLOY_AWS_EC2.md).
