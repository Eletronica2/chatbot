# Local production-like front: one HTTP port.
# Flutter SPA on /
# Backend on /api/ and /health
# WhatsApp webhook on /webhook
# Billing webhook on /api/v1/billing/webhooks/stripe (via backend)

# Docker's embedded DNS. Without `resolve`, container names are resolved once at startup and a recreated
# backend-api / whatsapp-gateway (new IP) yields 502 until nginx is reloaded.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

upstream backend_api {
    zone backend_api 64k;
    server backend-api:8000 resolve;
}

upstream whatsapp_gateway {
    zone whatsapp_gateway 64k;
    server whatsapp-gateway:40000 resolve;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 20m;

    root /usr/share/nginx/html;
    index index.html;

    location /health {
        proxy_pass http://backend_api/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /webhook {
        proxy_pass http://whatsapp_gateway/webhook;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /api/ {
        proxy_pass http://backend_api/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
