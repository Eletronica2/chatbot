services:
  mysql:
    image: mysql:8.4
    container_name: chatbot-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: chatbot
      MYSQL_USER: chatbot
      MYSQL_PASSWORD: chatbot
    ports:
      - "3310:3306"
    volumes:
      - mysqldata:/var/lib/mysql
      - ../database/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ../database/seed.sql:/docker-entrypoint-initdb.d/002_seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - chatbot-net

  flow-engine:
    build:
      context: ../flow-engine
    container_name: chatbot-flow-engine
    env_file:
      - ../flow-engine/.env.example
    ports:
      - "8002:8002"
    networks:
      - chatbot-net
    depends_on:
      mysql:
        condition: service_healthy

  ai-engine:
    build:
      context: ../ai-engine
    container_name: chatbot-ai-engine
    env_file:
      - ../ai-engine/.env
    ports:
      - "8003:8003"
    networks:
      - chatbot-net

  backend-api:
    build:
      context: ../backend-api
    container_name: chatbot-backend
    env_file:
      - ../backend-api/.env.example
    environment:
      FLOW_ENGINE_URL: http://flow-engine:8002
      AI_ENGINE_URL: http://ai-engine:8003
      DATABASE_URL: mysql+pymysql://chatbot:chatbot@mysql:3306/chatbot
      INTERNAL_API_KEY: internal-chatbot-key
    depends_on:
      flow-engine:
        condition: service_healthy
      ai-engine:
        condition: service_healthy
      mysql:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - chatbot-net

  whatsapp-gateway:
    build:
      context: ../whatsapp-gateway
    container_name: chatbot-whatsapp-gateway
    env_file:
      - ../whatsapp-gateway/.env.example
    environment:
      BACKEND_API_URL: http://backend-api:8000
      BACKEND_INTERNAL_API_KEY: internal-chatbot-key
    depends_on:
      backend-api:
        condition: service_healthy
    ports:
      - "40000:40000"
    networks:
      - chatbot-net

networks:
  chatbot-net:
    driver: bridge

volumes:
  mysqldata:
    driver: local
