version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: chatbot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: chatbot
      POSTGRES_PASSWORD: chatbot
      POSTGRES_DB: chatbot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - chatbot-net

  flow-engine:
    build:
      context: ../flow-engine
    container_name: chatbot-flow-engine
    env_file:
      - ../flow-engine/.env.example
    ports:
      - "8002:8002"
    networks:
      - chatbot-net
    depends_on:
      - postgres

  ai-engine:
    build:
      context: ../ai-engine
    container_name: chatbot-ai-engine
    env_file:
      - ../ai-engine/.env
    ports:
      - "8003:8003"
    networks:
      - chatbot-net

  backend-api:
    build:
      context: ../backend-api
    container_name: chatbot-backend
    env_file:
      - ../backend-api/.env.example
    environment:
      FLOW_ENGINE_URL: http://flow-engine:8002
      AI_ENGINE_URL: http://ai-engine:8003
      DATABASE_URL: postgres://chatbot:chatbot@postgres:5432/chatbot
    depends_on:
      - flow-engine
      - ai-engine
      - postgres
    ports:
      - "8000:8000"
    networks:
      - chatbot-net

  whatsapp-gateway:
    build:
      context: ../whatsapp-gateway
    container_name: chatbot-whatsapp-gateway
    env_file:
      - ../whatsapp-gateway/.env.example
    environment:
      BACKEND_API_URL: http://backend-api:8000
    depends_on:
      - backend-api
    ports:
      - "40000:40000"
    networks:
      - chatbot-net

networks:
  chatbot-net:
    driver: bridge

volumes:
  pgdata:
    driver: local
