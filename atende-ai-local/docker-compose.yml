name: atende-ai-local

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  ollama:
    image: ollama/ollama:0.40.2
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "8"
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      OLLAMA_CONTEXT_LENGTH: ${LLM_NUM_CTX:-4096}
      OLLAMA_LOAD_TIMEOUT: 5m
      OLLAMA_NO_CLOUD: "1"
      CUDA_VISIBLE_DEVICES: ""
    volumes:
      - ollama-models:/root/.ollama
    networks: [ai_internal, ai_egress]
    mem_limit: 7g
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *logging

  qdrant:
    image: qdrant/qdrant:v1.19.2
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY obrigatório}
      QDRANT__TELEMETRY_DISABLED: "true"
      QDRANT__LOG_LEVEL: WARN
    volumes:
      - qdrant-data:/qdrant/storage
      - qdrant-snapshots:/qdrant/snapshots
    networks: [ai_internal]
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /healthz HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *logging

  ai-api:
    build: ./ai-api
    image: atende-ai-local/ai-api:0.1.0
    restart: unless-stopped
    depends_on:
      ollama: {condition: service_healthy}
      qdrant: {condition: service_healthy}
    env_file: .env
    environment:
      OLLAMA_URL: http://ollama:11434
      QDRANT_URL: http://qdrant:6333
      CREDENTIALS_FILE: /config/credentials.json
      TENANTS_FILE: /config/tenants.json
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
    volumes:
      - ./config:/config:ro
      - hf-models:/models/hf
    ports:
      - "127.0.0.1:8100:8100"
    networks: [ai_internal, ai_egress]
    mem_limit: 4g
    logging: *logging

networks:
  ai_internal:
    internal: true
  ai_egress: {}

volumes:
  ollama-models:
  qdrant-data:
  qdrant-snapshots:
  hf-models:
