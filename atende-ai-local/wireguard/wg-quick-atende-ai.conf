# Atende AI IA-02: load/remove only this host's WireGuard firewall table.
# systemd starts nft directly, outside wg-quick's restricted nested AppArmor profile.
[Service]
ExecStartPre=-/usr/sbin/nft delete table inet atende_ai
ExecStartPre=/usr/sbin/nft -f /etc/wireguard/atende-ai.nft
ExecStopPost=-/usr/sbin/nft delete table inet atende_ai
