name: admin_panel
description: Flutter Web admin panel for WhatsApp chatbot with AI
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  intl: ^0.19.0
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1
  yaml: ^3.1.2
  file_picker: ^8.0.0
  cupertino_icons: ^1.0.2
  pdf: ^3.11.1
  printing: ^5.13.1

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/atenda-ai-mark.png
    - assets/brand/atenda-ai-mark.svg
    - assets/brand/atenda-ai-icon-stitch.png
