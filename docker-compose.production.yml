# Production-oriented stack. Fill .env.production first.
# Local check:
#   docker compose -f docker-compose.production.yml --env-file .env.production config
# Only nginx publishes a host port. Engines and MySQL stay unpublished.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-atenda}
      MYSQL_USER: ${MYSQL_USER:-atenda}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    logging: *default-logging
    networks:
      - atenda

  flow-engine:
    build:
      context: ./flow-engine
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: "8002"
      DEBUG: "false"
      LOG_LEVEL: ${FLOW_LOG_LEVEL:-INFO}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging
    networks:
      - atenda

  ai-engine:
    build:
      context: ./ai-engine
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: "8003"
      DEBUG: "false"
      LOG_LEVEL: ${AI_LOG_LEVEL:-INFO}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-flash-latest}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MOCK_AI: ${MOCK_AI:-true}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging
    networks:
      - atenda

  backend-api:
    build:
      context: ./backend-api
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: "8000"
      DEBUG: "false"
      LOG_LEVEL: ${BACKEND_LOG_LEVEL:-INFO}
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-atenda}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-atenda}
      FLOW_ENGINE_URL: http://flow-engine:8002
      AI_ENGINE_URL: http://ai-engine:8003
      GATEWAY_API_URL: http://whatsapp-gateway:40000
      APP_SECRET_KEY: ${APP_SECRET_KEY}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:8080}
      TRUST_PROXY: "true"
      ADMIN_PANEL_URL: ${ADMIN_PANEL_URL:-http://127.0.0.1:8080}
      BILLING_SUCCESS_URL: ${BILLING_SUCCESS_URL:-http://127.0.0.1:8080/#/billing/success?session_id={CHECKOUT_SESSION_ID}}
      BILLING_CANCEL_URL: ${BILLING_CANCEL_URL:-http://127.0.0.1:8080/#/billing/cancel}
      BILLING_PORTAL_RETURN_URL: ${BILLING_PORTAL_RETURN_URL:-http://127.0.0.1:8080/#/billing}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_STARTER: ${STRIPE_PRICE_STARTER:-}
      STRIPE_PRICE_GROWTH: ${STRIPE_PRICE_GROWTH:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      STRIPE_PRICE_ENTERPRISE: ${STRIPE_PRICE_ENTERPRISE:-}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_SYSTEM_USER_TOKEN: ${META_SYSTEM_USER_TOKEN:-}
      META_EMBEDDED_CONFIG_ID: ${META_EMBEDDED_CONFIG_ID:-}
      META_VERIFY_TOKEN: ${META_VERIFY_TOKEN}
      META_DATA_DELETION_BASE_URL: ${META_DATA_DELETION_BASE_URL:-http://127.0.0.1:8080/api/v1/meta/data-deletion/status}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD}
      DEFAULT_ADMIN_NAME: ${DEFAULT_ADMIN_NAME:-Superadmin}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-no-reply@example.com}
    depends_on:
      mysql:
        condition: service_healthy
      flow-engine:
        condition: service_healthy
      ai-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging
    networks:
      - atenda

  whatsapp-gateway:
    build:
      context: ./whatsapp-gateway
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: "40000"
      DEBUG: "false"
      LOG_LEVEL: ${GATEWAY_LOG_LEVEL:-INFO}
      BACKEND_API_URL: http://backend-api:8000
      BACKEND_INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      META_VERIFY_TOKEN: ${META_VERIFY_TOKEN}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_API_VERSION: ${META_API_VERSION:-v22.0}
    depends_on:
      backend-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:40000/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging
    networks:
      - atenda

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      backend-api:
        condition: service_healthy
      whatsapp-gateway:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/atenda-ai.local.conf:/etc/nginx/conf.d/default.conf:ro
      - ./admin-panel/build/web:/usr/share/nginx/html:ro
    logging: *default-logging
    networks:
      - atenda

networks:
  atenda:
    driver: bridge

volumes:
  mysql_data:
